<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcy</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
    <div class="container">
        <div class="heading">
            <div class="place">
                <p class="text1">Calculator</p>
                <div class="toggle">
                    <div class="dot green"></div>
                </div>
            </div>
    
            <input type="text" id="screen" value="0" readonly>
    
        </div>
    
        <div class="box">
            <button data-action="delete" class="text1">Del</button>
            <button data-action="clear" class="text2">AC</button>
            <button data-action="percent" class="text2">%</button>
            <button data-action="divide" class="text2">/</button>
            <button class="text1">7</button>
            <button class="text1">8</button>
            <button class="text1">9</button>
            <button data-action="multiply">
                <i class="fa-solid fa-xmark text2"></i>
            </button>
            <button class="text1">4</button>
            <button class="text1">5</button>
            <button class="text1">6</button>
            <button data-action="subtract">
                <i class="fa-solid fa-minus text2"></i>
            </button>
            <button class="text1">1</button>
            <button class="text1">2</button>
            <button class="text1">3</button>
            <button data-action="add">
                <i class="fa-solid fa-plus text2"></i>
            </button>
            <button class="text1 bigBtn">0</button>
            <button data-action="decimal">
                <i class="fa-solid fa-circle point"></i>
            </button>
            <button data-action="equal" class="green">
                <i class="fa-solid fa-equals"></i>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
